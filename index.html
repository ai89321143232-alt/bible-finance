<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (!localStorage.getItem('theme')) {
            document.documentElement.classList.toggle('dark', e.matches);
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Библия Финансов — Личный финансовый менеджер</title>
    <meta name="description" content="Библия Финансов — удобное приложение для управления личными и семейными финансами. Учёт доходов и расходов, бюджеты, цели накопления, AI-аналитика." />
    <meta name="keywords" content="финансы, бюджет, учёт расходов, личный финансовый менеджер, накопления, инвестиции" />
    <meta name="author" content="Библия Финансов" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Библия Финансов — Личный финансовый менеджер" />
    <meta property="og:description" content="Управляйте финансами легко: учёт доходов и расходов, бюджеты, цели накопления, AI-аналитика для всей семьи." />
    <meta property="og:locale" content="ru_RU" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0f1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Библия Финансов" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <link rel="apple-touch-icon" href="https://base44.com/logo_v2.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
